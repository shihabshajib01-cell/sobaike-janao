name: Harassment Feature Verification

on:
  push:
    branches:
      - harassment-classification-impl

permissions:
  contents: write

jobs:
  verify-and-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: harassment-classification-impl
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clear Harassment classification filters when desktop category changes away
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/pages/ExplorePage.tsx';
          let s = fs.readFileSync(path, 'utf8');
          const anchor = `  useEffect(() => {
    loadData();
  }, [loadData]);

  // Responsive resize safety`;
          if (!s.includes(anchor)) throw new Error('ExplorePage load effect anchor not found');
          const replacement = `  useEffect(() => {
    loadData();
  }, [loadData]);

  // Prevent hidden Harassment classification filters from leaking across category changes.
  useEffect(() => {
    if (selectedSection !== 'harassment') {
      setHarassmentFilters(EMPTY_HARASSMENT_CLASSIFICATION_FILTERS);
    }
  }, [selectedSection]);

  // Responsive resize safety`;
          s = s.replace(anchor, replacement);
          fs.writeFileSync(path, s);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit verified fix
        run: |
          git add src/pages/ExplorePage.tsx
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(harassment): clear explore classification filters on category change"
          git push origin HEAD:harassment-classification-impl
