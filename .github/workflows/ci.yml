name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Security source invariants
        shell: bash
        run: |
          set -euo pipefail
          if grep -R "VITE_ENABLE_MOCK_MODE !== 'false'" src; then
            echo "ERROR: production fail-open mock logic detected"
            exit 1
          fi
          if grep -R "dangerouslySetInnerHTML\|\.innerHTML[[:space:]]*=" src; then
            echo "ERROR: unsafe HTML sink detected; security review required"
            exit 1
          fi
          if grep -R "\beval[[:space:]]*(\|new Function[[:space:]]*(\|javascript:" src; then
            echo "ERROR: dynamic-code or javascript: sink detected; security review required"
            exit 1
          fi
          test -f supabase/migrations/20260915163600_public_security_evidence_hardening.sql
          test -f supabase/migrations/20260915164500_public_security_surface_limits.sql
          test -f supabase/migrations/20260915165000_public_security_policy_cleanup.sql
          test -f supabase/migrations/20260919155020_close_legacy_engagement_and_persist_ip_location_limit.sql
          test -f supabase/migrations/20260919161859_close_legacy_engagement_and_network_surface.sql
          # Legacy anonymous engagement RPCs must never be restored to frontend use.
          if grep -R "rpc('track_public_report_view_v2\|rpc('track_public_report_share_v2" src; then
            echo "ERROR: legacy engagement RPC usage detected"
            exit 1
          fi
          grep -q "public-write-gateway" src/services/publicEngagementService.ts
          grep -q "p_action: \"ip_location\"" supabase/functions/public-ip-location/index.ts
          if grep -q "x-forwarded-for" supabase/functions/public-write-gateway/index.ts; then
            echo "ERROR: public write gateway must not trust client X-Forwarded-For"
            exit 1
          fi

      - name: Security hardening audit
        run: npm run audit:security-hardening

      - name: Integration contract audit
        run: npm run audit:integration-contract

      - name: Design-system source audit
        run: npm run audit:design-system

      - name: Category theme propagation audit
        run: npm run audit:category-theme

      - name: UI uniformity source audit
        run: npm run audit:ui-uniformity

      - name: Accessibility source audit
        run: npm run audit:accessibility

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_FORM_SCHEMA_SMOKE: '1'

      - name: Install accessibility browser runtime
        run: |
          npm install --no-save playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: Run local WCAG accessibility smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/sobaike-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          FORM_SCHEMA_SMOKE=1 SITE_URL=http://127.0.0.1:4173/ node scripts/public-accessibility-smoke.mjs
