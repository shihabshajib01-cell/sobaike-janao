name: One-time Remove Report Draft Persistence

on:
  push:
    branches:
      - fix/remove-report-draft-saving

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[draft-refactor-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/remove-report-draft-saving
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Normalize one-time script
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/remove-report-draft-refactor.mjs')
          text = path.read_text()
          old = "throw new Error(`draft storage exists after cancellation: ${JSON.stringify(storedDrafts)}`);"
          new = "throw new Error('draft storage exists after cancellation: ' + JSON.stringify(storedDrafts));"
          if old not in text:
              raise SystemExit('expected diagnostic literal not found')
          text = text.replace(old, new)

          marker = "// 7) Remove obsolete persisted-draft modules."
          if marker not in text:
              raise SystemExit('refactor insertion marker not found')
          extra = r'''
// Remove attachment UI that existed only to recover persisted evidence drafts.
{
  const path = 'src/components/report-composer/Step3ComplaintDetails.tsx';
  let text = read(path);
  const startMarker = '              {formData.pendingEvidenceRecovery &&';
  const endMarker = '              {/* Image Attachment Picker - max 6 images */}';
  const start = text.indexOf(startMarker);
  const end = text.indexOf(endMarker, start);
  if (start === -1 || end === -1) throw new Error('Could not locate Step 3 evidence recovery warning');
  text = text.slice(0, start) + text.slice(end);
  write(path, text);
}

{
  const path = 'src/components/report-composer/Step4Review.tsx';
  let text = read(path);
  const oldSummary = `  const hasMissingEvidence =
    pendingImages.length === 0 &&
    Boolean(formData.pendingEvidenceRecovery && formData.pendingEvidenceRecovery.expectedCount > 0);

  const attachmentsSummary = hasMissingEvidence
    ? language === 'bn'
      ? 'পুনরায় সংযুক্তি আবশ্যক'
      : 'Reattachment required'
    : pendingImages.length > 0
    ? language === 'bn'
      ? \`${pendingImages.length} টি ছবি সংযুক্ত\`
      : \`${pendingImages.length} images attached\`
    : language === 'bn'
    ? 'কোনো ছবি সংযুক্ত নেই'
    : 'No attachments';`;
  const newSummary = `  const attachmentsSummary = pendingImages.length > 0
    ? language === 'bn'
      ? \`${pendingImages.length} টি ছবি সংযুক্ত\`
      : \`${pendingImages.length} images attached\`
    : language === 'bn'
    ? 'কোনো ছবি সংযুক্ত নেই'
    : 'No attachments';`;
  text = replaceOnce(text, oldSummary, newSummary, 'Step 4 attachment summary');

  const warningStartMarker = '              {hasMissingEvidence ? (';
  const warningEndMarker = '              ) : pendingImages.length > 0 ? (';
  const warningStart = text.indexOf(warningStartMarker);
  const warningEnd = text.indexOf(warningEndMarker, warningStart);
  if (warningStart === -1 || warningEnd === -1) throw new Error('Could not locate Step 4 evidence recovery warning');
  text = text.slice(0, warningStart) + '              {pendingImages.length > 0 ? (' + text.slice(warningEnd + warningEndMarker.length);
  write(path, text);
}

'''
          text = text.replace(marker, extra + marker)
          path.write_text(text)
          PY

      - name: Apply scoped refactor
        run: |
          if ! node scripts/remove-report-draft-refactor.mjs > refactor.log 2>&1; then
            echo "--- residual draft references after failed transform ---" >> refactor.log
            grep -R -n "pendingEvidenceRecovery\|DraftRepository\|EvidenceDraftStorage\|CURRENT_REPORT_FLOW_VERSION\|interface DraftReport" src --include='*.ts' --include='*.tsx' >> refactor.log || true
            exit 1
          fi

      - name: Upload refactor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-draft-refactor-log
          path: refactor.log

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify scope and remove one-time tooling
        run: |
          test ! -f src/services/draftRepository.ts
          test ! -f src/services/evidenceDraftStorage.ts
          ! grep -R "DraftRepository\|EvidenceDraftStorage\|pendingEvidenceRecovery\|draft-save-exit-btn\|draft-recovery-" src --include='*.ts' --include='*.tsx'
          rm scripts/remove-report-draft-refactor.mjs
          rm .github/workflows/remove-report-drafts-refactor.yml
          rm -f refactor.log

      - name: Commit product changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove report draft persistence [draft-refactor-applied]"
          git push origin HEAD:fix/remove-report-draft-saving
