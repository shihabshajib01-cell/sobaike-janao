name: Harassment Feature Implementation

on:
  push:
    branches:
      - harassment-classification-impl

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: harassment-classification-impl
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic source patch
        run: node scripts/run-harassment-feature-codemod.mjs

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit verified source changes
        run: |
          rm -f scripts/apply-harassment-classification-feature.mjs scripts/run-harassment-feature-codemod.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts supabase
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat(harassment): implement classification and searchable filters"
          git push origin HEAD:harassment-classification-impl
