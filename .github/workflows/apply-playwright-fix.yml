name: Apply Playwright Security Fix

on:
  push:
    branches: [hardening/public-100-closure]
    paths:
      - .github/workflows/apply-playwright-fix.yml

permissions:
  contents: write

jobs:
  dependency-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: hardening/public-100-closure

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade Playwright to fixed version
        run: npm install --save-dev playwright@1.55.1

      - name: Commit package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Playwright already secure."
            exit 0
          fi
          git commit -m "Security: upgrade Playwright to 1.55.1"
          git push origin HEAD:hardening/public-100-closure
