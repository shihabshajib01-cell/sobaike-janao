name: Mock Dead Code Cleanup

on:
  push:
    branches:
      - cleanup/mock-dead-code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/mock-dead-code

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify cleaned baseline
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "SEED_SUBMITTED_REPORTS\|seedSubmissions\|sobaike_janao_mock_reports\|VITE_ENABLE_MOCK_MODE\|ViewportDebugger\|ViewportDiagnostic\|Viewport Diagnostic" src .env.example index.html
          npm run lint
          npm run build

      - name: Reference audit for remaining likely compatibility or dead files
        shell: bash
        run: |
          set -euo pipefail
          for needle in reportStorage AttachmentImageModal "services/index"; do
            echo "===== REFERENCES: $needle ====="
            git grep -n "$needle" -- ':!*.md' || true
          done
          echo "===== TODO/FIXME/STUB/PLACEHOLDER ====="
          git grep -n -E "TODO|FIXME|stub|placeholder|not implemented|coming soon" -- 'src/**/*.ts' 'src/**/*.tsx' || true

      - name: Static unused-file/export audit
        shell: bash
        run: |
          set +e
          npx --yes knip --reporter compact
          exit 0
