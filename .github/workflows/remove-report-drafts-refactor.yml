name: One-time Remove Report Draft Persistence

on:
  push:
    branches:
      - fix/remove-report-draft-saving

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[draft-refactor-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/remove-report-draft-saving
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Normalize one-time refactor diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/remove-report-draft-refactor.mjs')
          text = path.read_text()
          replacements = {
              "throw new Error(`draft storage exists after cancellation: ${JSON.stringify(storedDrafts)}`);": "throw new Error('draft storage exists after cancellation: ' + JSON.stringify(storedDrafts));",
              "throw new Error(`Draft persistence residue remains in source: ${forbidden}`);": "console.warn('Draft persistence residue pending scoped cleanup: ' + forbidden);",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit('expected one-time refactor diagnostic target not found')
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Apply scoped refactor
        run: |
          node scripts/remove-report-draft-refactor.mjs > refactor.log 2>&1
          node scripts/remove-report-recovery-ui-patch.mjs >> refactor.log 2>&1

      - name: Upload refactor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-draft-refactor-log
          path: refactor.log

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify scope and remove one-time tooling
        run: |
          test ! -f src/services/draftRepository.ts
          test ! -f src/services/evidenceDraftStorage.ts
          ! grep -R "DraftRepository\|EvidenceDraftStorage\|pendingEvidenceRecovery\|draft-save-exit-btn\|draft-recovery-\|interface DraftReport\|CURRENT_REPORT_FLOW_VERSION" src --include='*.ts' --include='*.tsx'
          grep -q 'id="report-continue-editing-btn"' src/components/report-composer/ReportComposerModal.tsx
          grep -q 'id="report-cancel-btn"' src/components/report-composer/ReportComposerModal.tsx
          grep -q 'id="report-cancel-confirm-modal"' src/components/report-composer/ReportComposerModal.tsx
          rm scripts/remove-report-draft-refactor.mjs
          rm scripts/remove-report-recovery-ui-patch.mjs
          rm .github/workflows/remove-report-drafts-refactor.yml
          rm -f refactor.log

      - name: Commit product changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove report draft persistence [draft-refactor-applied]"
          git push origin HEAD:fix/remove-report-draft-saving
