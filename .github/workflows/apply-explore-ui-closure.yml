name: Apply Explore UI Closure

on:
  push:
    branches: [fix/public-ui-uniformity-closure]
    paths:
      - scripts/apply-explore-ui-closure.mjs
      - .github/workflows/apply-explore-ui-closure.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          ref: fix/public-ui-uniformity-closure
          fetch-depth: 0

      - name: Apply deterministic Explore patch
        run: node scripts/apply-explore-ui-closure.mjs

      - name: Remove one-time patch machinery
        run: rm scripts/apply-explore-ui-closure.mjs .github/workflows/apply-explore-ui-closure.yml

      - name: Commit closure patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Normalize Explore controls and semantic UI tokens"
          git push origin HEAD:fix/public-ui-uniformity-closure
