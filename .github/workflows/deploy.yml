name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Refresh crawlable taxonomy/topic SEO artifacts from live published data.
    - cron: '17 */6 * * *'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  # All production-capable events for the same ref share one lane. This prevents
  # a scheduled/manual SEO refresh from racing a normal push deployment.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Require successful CI for exact revision
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Waiting for CI to finish for exact revision ${TARGET_SHA}..."
          for attempt in {1..90}; do
            curl --fail-with-body -sS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=100" \
              -o /tmp/ci-runs.json

            state=$(python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/ci-runs.json').read_text())
          runs = [
              run for run in data.get('workflow_runs', [])
              if run.get('name') == 'CI'
          ]
          if not runs:
              print('missing')
          else:
              run = sorted(runs, key=lambda item: item.get('created_at') or '', reverse=True)[0]
              status = run.get('status') or 'unknown'
              conclusion = run.get('conclusion') or ''
              if status != 'completed':
                  print('pending')
              elif conclusion == 'success':
                  print('success')
              else:
                  print('failed:' + conclusion)
          PY
            )

            case "${state}" in
              success)
                echo "Exact-revision CI passed. Deployment may continue."
                break
                ;;
              failed:*)
                echo "ERROR: exact-revision CI did not pass: ${state#failed:}"
                exit 1
                ;;
              missing|pending)
                if [ "${attempt}" -eq 90 ]; then
                  echo "ERROR: timed out waiting for exact-revision CI"
                  exit 1
                fi
                sleep 5
                ;;
              *)
                echo "ERROR: unexpected CI gate state: ${state}"
                exit 1
                ;;
            esac
          done

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Security hardening audit
        run: npm run audit:security-hardening

      - name: Integration contract audit
        run: npm run audit:integration-contract

      - name: Category theme propagation audit
        run: npm run audit:category-theme

      - name: Type check
        run: npm run lint

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
        run: npm run build

      - name: Optimize deployed hero JPEGs
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jpegoptim
          bash scripts/optimize-static-images.sh

      - name: Verify Vite output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/public-report-routes.json
          test -f dist/favicon.png
          test -f dist/issues/index.html
          test -f dist/explore/index.html
          test -f dist/geo/bangladesh-districts-2020.geojson
          grep -q "https://shobaikejanao.com/sitemap.xml" dist/robots.txt
          grep -q 'href="/favicon.png"' dist/index.html
          grep -q "https://shobaikejanao.com/issues" dist/issues/index.html
          echo "Checking generated index"
          cat dist/index.html
          if grep -q "/src/main.tsx" dist/index.html
          then
            echo "ERROR: source index deployed"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
