name: Apply bribery contract patch

on:
  push:
    branches:
      - fix/bribery-single-subcategory-details
    paths:
      - scripts/apply_bribery_contract.py
      - .github/workflows/apply-bribery-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/bribery-single-subcategory-details
          fetch-depth: 0

      - name: Apply exact guarded replacements
        run: python scripts/apply_bribery_contract.py

      - name: Commit production source changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "feat(public): align single bribery reporting contract"
          git push origin HEAD:fix/bribery-single-subcategory-details
