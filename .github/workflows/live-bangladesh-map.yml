name: Live Bangladesh Map Verification

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]

permissions:
  contents: read

jobs:
  mobile-and-desktop:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install audited app dependencies
        run: npm ci
      - name: Install browser verification runtime
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Verify real live country-only map on mobile and desktop
        env:
          SITE_URL: https://shobaikejanao.com/
        run: node scripts/live-bangladesh-map-smoke.mjs
      - name: Preserve live screenshots even if a test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-bangladesh-map-screenshots
          path: map-smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 7
