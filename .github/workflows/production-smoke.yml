name: Production Smoke

on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
  workflow_dispatch:
  schedule:
    # Regularly re-check the live search surface even when there is no deployment.
    - cron: '23 */6 * * *'

permissions:
  contents: read

concurrency:
  group: production-smoke-live
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: https://shobaikejanao.com/
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Verify live Public site
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in {1..12}; do
            code=$(curl -L -sS -o /tmp/public-index.html -w "%{http_code}" "$SITE_URL" || true)
            if [ "$code" = "200" ]; then
              ok=1
              break
            fi
            echo "Attempt $attempt returned HTTP $code; retrying..."
            sleep 10
          done
          test "$ok" = "1"
          python - <<'PY'
          from pathlib import Path
          html = Path('/tmp/public-index.html').read_text(errors='replace')
          if 'id="root"' not in html and "id='root'" not in html:
              raise SystemExit('ERROR: production HTML is missing the React root element')
          if '/src/main.tsx' in html:
              raise SystemExit('ERROR: production page references source entry instead of bundled assets')
          print('Public site smoke check passed')
          PY


      - name: Verify Public-SQL-Admin sync contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"

          curl --fail-with-body -sS \
            -X POST "$SUPABASE_URL/rest/v1/rpc/get_platform_sync_contract_version" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' > /tmp/platform-sync-contract.json

          python - <<'PY'
          import json
          from pathlib import Path

          expected = "2026-09-19.2"
          actual = json.loads(Path('/tmp/platform-sync-contract.json').read_text())
          if actual != expected:
              raise SystemExit(
                  f"ERROR: Public-SQL-Admin sync contract mismatch: expected {expected}, got {actual}"
              )
          print(f"Public-SQL-Admin sync contract verified: {actual}")
          PY


      - name: Verify public reporting configuration exposure contract
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"

          curl --fail-with-body -sS \
            -X POST "$SUPABASE_URL/rest/v1/rpc/get_public_reporting_configuration" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' > /tmp/public-reporting-config.json

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/public-reporting-config.json').read_text())
          segments = data.get('segments')
          subcategories = data.get('subcategories')
          forms = data.get('forms')

          if not isinstance(segments, list) or not isinstance(subcategories, list) or not isinstance(forms, list):
              raise SystemExit('ERROR: public reporting configuration shape changed')

          subcategory_ids = {
              item.get('id') for item in subcategories
              if isinstance(item, dict) and item.get('id')
          }
          form_subcategory_ids_list = [
              item.get('subcategoryId') for item in forms
              if isinstance(item, dict) and item.get('subcategoryId')
          ]
          form_subcategory_ids = set(form_subcategory_ids_list)

          leaked_forms = sorted(form_subcategory_ids - subcategory_ids)
          missing_forms = sorted(subcategory_ids - form_subcategory_ids)
          duplicate_form_ids = sorted({
              item_id
              for item_id in form_subcategory_ids
              if form_subcategory_ids_list.count(item_id) > 1
          })

          if leaked_forms:
              raise SystemExit(
                  f'ERROR: forms exposed for inactive/unavailable subcategories: {leaked_forms}'
              )
          if missing_forms:
              raise SystemExit(
                  f'ERROR: public subcategories missing reporting forms: {missing_forms}'
              )
          if duplicate_form_ids:
              raise SystemExit(
                  f'ERROR: duplicate public reporting forms: {duplicate_form_ids}'
              )

          print(
              'Public reporting configuration exposure contract passed: '
              f'{len(subcategory_ids)} subcategories / {len(form_subcategory_ids)} forms'
          )
          PY

      - name: Verify first-party browse IP fallback
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"

          curl --fail-with-body -sS \
            "$SUPABASE_URL/functions/v1/public-ip-location" \
            -H "Accept: application/json" \
            -o /tmp/public-ip-location.json

          python - <<'PY'
          import json
          import math
          from pathlib import Path

          data = json.loads(Path('/tmp/public-ip-location.json').read_text())
          lat = data.get('latitude')
          lng = data.get('longitude')
          accuracy = data.get('accuracy')

          if not isinstance(lat, (int, float)) or not math.isfinite(lat) or not (-90 <= lat <= 90):
              raise SystemExit('ERROR: first-party IP fallback returned invalid latitude')
          if not isinstance(lng, (int, float)) or not math.isfinite(lng) or not (-180 <= lng <= 180):
              raise SystemExit('ERROR: first-party IP fallback returned invalid longitude')
          if not isinstance(accuracy, (int, float)) or accuracy <= 0:
              raise SystemExit('ERROR: first-party IP fallback returned invalid accuracy')

          print('First-party browse IP fallback smoke check passed')
          PY

      - name: Verify live SEO surface
        shell: bash
        run: |
          set -euo pipefail

          curl --fail-with-body -L -sS "${SITE_URL}robots.txt" -o /tmp/robots.txt
          curl --fail-with-body -L -sS "${SITE_URL}sitemap.xml" -o /tmp/sitemap.xml

          python - <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          origin = 'https://shobaikejanao.com'
          html = Path('/tmp/public-index.html').read_text(errors='replace')
          robots = Path('/tmp/robots.txt').read_text(errors='replace')
          sitemap = Path('/tmp/sitemap.xml').read_text(errors='replace')

          def must(pattern, label, flags=0):
              match = re.search(pattern, html, flags)
              if not match:
                  raise SystemExit(f'ERROR: missing {label}')
              return match

          title = must(r'<title>(.*?)</title>', 'homepage title', re.S).group(1).strip()
          if not title.startswith('Sobaike Janao'):
              raise SystemExit(f'ERROR: exact brand signal missing from title: {title}')

          canonical = must(
              r'<link\s+rel=["\']canonical["\']\s+href=["\']([^"\']+)["\']',
              'homepage canonical',
              re.I,
          ).group(1)
          if canonical != f'{origin}/':
              raise SystemExit(f'ERROR: homepage canonical mismatch: {canonical}')

          robots_meta = must(
              r'<meta\s+name=["\']robots["\']\s+content=["\']([^"\']+)["\']',
              'robots meta',
              re.I,
          ).group(1).lower()
          if 'index' not in robots_meta or 'follow' not in robots_meta or 'noindex' in robots_meta:
              raise SystemExit(f'ERROR: homepage robots meta is not indexable: {robots_meta}')

          schema_match = must(
              r'<script\s+type=["\']application/ld\+json["\'][^>]*id=["\']seo-jsonld["\'][^>]*>(.*?)</script>',
              'SEO JSON-LD',
              re.I | re.S,
          )
          data = json.loads(schema_match.group(1))
          graph = data.get('@graph', [data]) if isinstance(data, dict) else data
          if not any(node.get('@type') == 'WebSite' and node.get('name') == 'Sobaike Janao' for node in graph):
              raise SystemExit('ERROR: WebSite brand structured data is missing')
          if not any(node.get('@type') == 'Organization' and node.get('name') == 'Sobaike Janao' for node in graph):
              raise SystemExit('ERROR: Organization structured data is missing')

          if f'Sitemap: {origin}/sitemap.xml' not in robots:
              raise SystemExit('ERROR: robots.txt does not advertise the canonical sitemap')

          root = ET.fromstring(sitemap)
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs = [
              node.text.strip()
              for node in root.findall('sm:url/sm:loc', ns)
              if node.text and node.text.strip()
          ]
          if len(locs) != len(set(locs)):
              raise SystemExit('ERROR: duplicate sitemap <loc> entries detected')
          if f'{origin}/' not in locs:
              raise SystemExit('ERROR: Bangla homepage missing from sitemap')
          if f'{origin}/en/' not in locs:
              raise SystemExit('ERROR: English homepage missing from sitemap')

          report_urls = [url for url in locs if '/report-detail/' in url]
          if not report_urls:
              raise SystemExit('ERROR: no indexable report-detail URL found in sitemap')

          Path('/tmp/seo-report-url.txt').write_text(report_urls[0])
          print(f'Live SEO homepage/sitemap checks passed ({len(locs)} sitemap URLs)')
          PY

          report_url=$(cat /tmp/seo-report-url.txt)
          curl --fail-with-body -L -sS "$report_url" -o /tmp/seo-report.html

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          url = Path('/tmp/seo-report-url.txt').read_text().strip()
          html = Path('/tmp/seo-report.html').read_text(errors='replace')

          canonical = re.search(
              r'<link\s+rel=["\']canonical["\']\s+href=["\']([^"\']+)["\']',
              html,
              re.I,
          )
          if not canonical or canonical.group(1) != url:
              raise SystemExit(
                  f'ERROR: report canonical mismatch: expected {url}, got {canonical.group(1) if canonical else "missing"}'
              )

          robots = re.search(
              r'<meta\s+name=["\']robots["\']\s+content=["\']([^"\']+)["\']',
              html,
              re.I,
          )
          if not robots or 'noindex' in robots.group(1).lower():
              raise SystemExit('ERROR: sitemap report URL is not indexable')

          schema = re.search(
              r'<script\s+type=["\']application/ld\+json["\'][^>]*id=["\']seo-jsonld["\'][^>]*>(.*?)</script>',
              html,
              re.I | re.S,
          )
          if not schema:
              raise SystemExit('ERROR: report JSON-LD is missing')
          data = json.loads(schema.group(1))
          graph = data.get('@graph', [data]) if isinstance(data, dict) else data
          article = next((node for node in graph if node.get('@type') == 'Article'), None)
          if not article:
              raise SystemExit('ERROR: report Article structured data is missing')
          if article.get('url') != url:
              raise SystemExit(f'ERROR: report Article URL mismatch: {article.get("url")}')
          if not article.get('dateModified'):
              raise SystemExit('ERROR: report Article dateModified is missing')

          breadcrumb = next((node for node in graph if node.get('@type') == 'BreadcrumbList'), None)
          if not breadcrumb or len(breadcrumb.get('itemListElement', [])) < 2:
              raise SystemExit('ERROR: report breadcrumb structured data is incomplete')

          print('Live report SEO checks passed')
          PY

      - name: Verify public Supabase payload privacy
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"

          curl --fail-with-body -sS \
            -X POST "$SUPABASE_URL/rest/v1/rpc/get_public_published_reports" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' > /tmp/published-reports.json

          curl --fail-with-body -sS \
            -X POST "$SUPABASE_URL/rest/v1/rpc/get_public_home_feed_page" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_visitor_lat":null,"p_visitor_lng":null,"p_filter":"all","p_district":"all","p_offset":0,"p_limit":10}' > /tmp/home-feed.json

          python - <<'PY'
          import json
          from pathlib import Path

          forbidden_exact = {
              'latitude', 'longitude', 'lat', 'lng', 'coordinates', 'coordinate',
              'distance', 'distance_m', 'distance_meters', 'visitor_lat', 'visitor_lng',
              'reporter_latitude', 'reporter_longitude', 'reporter_lat', 'reporter_lng',
              'gps', 'location_accuracy', 'location_accuracy_m', 'location_accuracy_meters',
              'reporter_contact', 'contact_info', 'contact_email_or_phone',
              'client_submission_id', 'visitor_id', 'session_id'
          }

          def scan(value, path='root'):
              leaks = []
              if isinstance(value, dict):
                  for key, child in value.items():
                      normalized = str(key).lower()
                      if normalized in forbidden_exact:
                          leaks.append(f'{path}.{key}')
                      leaks.extend(scan(child, f'{path}.{key}'))
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      leaks.extend(scan(child, f'{path}[{index}]'))
              return leaks

          for filename in ('/tmp/published-reports.json', '/tmp/home-feed.json'):
              data = json.loads(Path(filename).read_text())
              leaks = scan(data)
              if leaks:
                  raise SystemExit(f'Public privacy regression in {filename}: {leaks[:20]}')

          print('Public Supabase payload privacy check passed')
          PY

      - name: Verify hardened anonymous RPC surface
        shell: bash
        run: |
          set -euo pipefail

          call_rpc() {
            local rpc="$1"
            local payload="$2"
            local outfile="$3"
            curl -sS -o "$outfile" -w "%{http_code}" \
              -X POST "$SUPABASE_URL/rest/v1/rpc/$rpc" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              -H "Content-Type: application/json" \
              -d "$payload"
          }

          legacy_code=$(call_rpc \
            submit_public_complaint \
            '{"p_payload":{},"p_client_submission_id":"security-test-legacy","p_reporter_context":{}}' \
            /tmp/legacy-submit.json)

          if ! grep -qi "permission denied" /tmp/legacy-submit.json; then
            echo "ERROR: legacy submit_public_complaint is still anonymously callable (HTTP $legacy_code)"
            cat /tmp/legacy-submit.json
            exit 1
          fi

          legacy_view_code=$(call_rpc \
            track_public_report_view_v2 \
            '{"p_report_id":"__security_test__","p_visitor_id":"00000000-0000-4000-8000-000000000001"}' \
            /tmp/legacy-view-v2.json)

          if ! grep -qi "permission denied" /tmp/legacy-view-v2.json; then
            echo "ERROR: legacy track_public_report_view_v2 is anonymously callable (HTTP $legacy_view_code)"
            cat /tmp/legacy-view-v2.json
            exit 1
          fi

          legacy_share_code=$(call_rpc \
            track_public_report_share_v2 \
            '{"p_report_id":"__security_test__","p_visitor_id":"00000000-0000-4000-8000-000000000001"}' \
            /tmp/legacy-share-v2.json)

          if ! grep -qi "permission denied" /tmp/legacy-share-v2.json; then
            echo "ERROR: legacy track_public_report_share_v2 is anonymously callable (HTTP $legacy_share_code)"
            cat /tmp/legacy-share-v2.json
            exit 1
          fi

          helper_code=$(call_rpc \
            can_upload_public_evidence \
            '{"p_storage_path":"public-submissions/security-test/file.webp"}' \
            /tmp/legacy-helper.json)

          if ! grep -qi "permission denied" /tmp/legacy-helper.json; then
            echo "ERROR: obsolete can_upload_public_evidence helper is still anonymously callable (HTTP $helper_code)"
            cat /tmp/legacy-helper.json
            exit 1
          fi

          duplicate_read_code=$(call_rpc \
            is_public_published_evidence \
            '{"p_storage_path":"public-submissions/security-test/file.webp"}' \
            /tmp/duplicate-read-helper.json)

          if ! grep -qi "permission denied" /tmp/duplicate-read-helper.json; then
            echo "ERROR: duplicate published-evidence helper is still anonymously callable (HTTP $duplicate_read_code)"
            cat /tmp/duplicate-read-helper.json
            exit 1
          fi

          current_code=$(call_rpc \
            can_upload_public_complaint_evidence \
            '{"p_storage_path":"public-submissions/security-test/file.webp"}' \
            /tmp/current-helper.json)

          if [ "$current_code" != "200" ] || [ "$(cat /tmp/current-helper.json)" != "false" ]; then
            echo "ERROR: current evidence policy helper contract changed unexpectedly"
            cat /tmp/current-helper.json
            exit 1
          fi

          published_read_code=$(call_rpc \
            is_published_complaint_evidence \
            '{"p_storage_path":"public-submissions/security-test/file.webp"}' \
            /tmp/published-read-helper.json)

          if [ "$published_read_code" != "200" ] || [ "$(cat /tmp/published-read-helper.json)" != "false" ]; then
            echo "ERROR: published-evidence read helper contract changed unexpectedly"
            cat /tmp/published-read-helper.json
            exit 1
          fi

          echo "Anonymous RPC surface hardening check passed"
