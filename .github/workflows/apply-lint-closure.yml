name: Apply Public Lint Closure

on:
  push:
    branches: [hardening/public-100-closure]
    paths:
      - .github/workflows/apply-lint-closure.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: hardening/public-100-closure

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply verified cleanup
        run: node scripts/apply-lint-closure.mjs

      - name: Verify lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Commit source cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No source cleanup needed."
            exit 0
          fi
          git commit -m "Quality: resolve Public source lint findings"
          git push origin HEAD:hardening/public-100-closure
