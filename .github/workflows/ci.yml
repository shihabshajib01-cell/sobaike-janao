name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Security source invariants
        shell: bash
        run: |
          set -euo pipefail
          if grep -R "VITE_ENABLE_MOCK_MODE !== 'false'" src; then
            echo "ERROR: production fail-open mock logic detected"
            exit 1
          fi
          if grep -R "dangerouslySetInnerHTML\|\.innerHTML[[:space:]]*=" src; then
            echo "ERROR: unsafe HTML sink detected; security review required"
            exit 1
          fi
          if grep -R "\beval[[:space:]]*(\|new Function[[:space:]]*(\|javascript:" src; then
            echo "ERROR: dynamic-code or javascript: sink detected; security review required"
            exit 1
          fi
          test -f supabase/migrations/20260915163600_public_security_evidence_hardening.sql
          test -f supabase/migrations/20260915164500_public_security_surface_limits.sql
          test -f supabase/migrations/20260915165000_public_security_policy_cleanup.sql

      - name: Design-system source audit
        run: npm run audit:design-system

      - name: UI uniformity source audit
        run: npm run audit:ui-uniformity

      - name: Technical-quality source audit
        run: npm run audit:technical-quality

      - name: Source lint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Bundle budget
        run: npm run audit:bundle

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility regression
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/public-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          READY=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/public-preview.log
            echo "ERROR: preview server did not become ready"
            exit 1
          fi
          SITE_URL=http://127.0.0.1:4173/ npm run test:a11y
