name: Harassment Feature Verification

on:
  push:
    branches:
      - harassment-classification-impl

permissions:
  contents: write

jobs:
  verify-and-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: harassment-classification-impl
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused Explore filter reset
        run: node scripts/fix-explore-harassment-filter-reset.mjs

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit verified fix
        run: |
          rm -f scripts/fix-explore-harassment-filter-reset.mjs
          git add src/pages/ExplorePage.tsx scripts
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(harassment): clear explore classification filters on category change"
          git push origin HEAD:harassment-classification-impl
