name: Mock Dead Code Cleanup

on:
  push:
    branches:
      - cleanup/mock-dead-code
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/mock-dead-code

      - name: Verify cleanup candidates before editing
        shell: bash
        run: |
          set -euo pipefail
          test -f src/data/seedSubmissions.ts
          test -f src/components/debug/ViewportDebugger.tsx
          test -f src/components/ui/ViewportDiagnostic.tsx
          test "$(grep -R -l "../data/seedSubmissions\|data/seedSubmissions" src | wc -l)" -eq 1
          test "$(grep -R -l "ViewportDebugger" src | wc -l)" -eq 2
          test "$(grep -R -l "ViewportDiagnostic" src | wc -l)" -eq 1
          grep -q "VITE_ENABLE_MOCK_MODE" .env.example
          grep -q "Viewport & screen reporting diagnostic" index.html

      - name: Remove proven mock and diagnostic code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          # Public report reads: remove seed/local mock storage and fail closed.
          path = Path('src/services/publicReportService.ts')
          text = path.read_text()
          text = replace_once(text, "import { SEED_SUBMITTED_REPORTS } from '../data/seedSubmissions';\n", '', 'seed import')
          start = text.index('const mapSeedToReportItem =')
          end = text.index('// In-flight request deduplication map')
          text = text[:start] + text[end:]

          old = """    if (!isSupabaseConfigured() || !supabase) {\n      if (isMockModeAllowed()) {\n        const local = getLocalMockReports().map(mapSeedToReportItem);\n        list = [...local, ...SEED_SUBMITTED_REPORTS.map(mapSeedToReportItem)];\n      } else {\n        throw new Error('Public reports service is currently unavailable.');\n      }\n    } else {"""
          new = """    if (!isSupabaseConfigured() || !supabase) {\n      throw new Error('Public reports service is currently unavailable.');\n    } else {"""
          text = replace_once(text, old, new, 'getAll unavailable branch')

          old = """      if (error) {\n        console.warn('[PublicReportService.getAll] Supabase RPC error:', error);\n        if (isMockModeAllowed()) {\n          const local = getLocalMockReports().map(mapSeedToReportItem);\n          list = [...local, ...SEED_SUBMITTED_REPORTS.map(mapSeedToReportItem)];\n        } else {\n          throw new Error(error.message || 'Failed to load public reports from server.');\n        }\n      } else if (data && Array.isArray(data)) {"""
          new = """      if (error) {\n        console.warn('[PublicReportService.getAll] Supabase RPC error:', error);\n        throw new Error(error.message || 'Failed to load public reports from server.');\n      } else if (data && Array.isArray(data)) {"""
          text = replace_once(text, old, new, 'getAll RPC fallback')

          old = """    if (!isSupabaseConfigured() || !supabase) {\n      if (isMockModeAllowed()) {\n        const local = getLocalMockReports().map(mapSeedToReportItem);\n        const combined = [...local, ...SEED_SUBMITTED_REPORTS.map(mapSeedToReportItem)];\n        const found = combined.find((r) => r.id.toUpperCase() === cleanId);\n        if (found) {\n          return {\n            report: found,\n            responses: [],\n            responseLoadError: false,\n          };\n        }\n        return null;\n      }\n      throw new Error('Public reports service is currently unavailable.');\n    }"""
          new = """    if (!isSupabaseConfigured() || !supabase) {\n      throw new Error('Public reports service is currently unavailable.');\n    }"""
          text = replace_once(text, old, new, 'getById unavailable branch')

          old = """    if (error) {\n      console.warn('[PublicReportService.getById] Supabase RPC error:', error);\n      if (isMockModeAllowed()) {\n        const seed = SEED_SUBMITTED_REPORTS.find((r) => r.id.toUpperCase() === cleanId);\n        if (seed) {\n          return {\n            report: mapSeedToReportItem(seed),\n            responses: [],\n            responseLoadError: false,\n          };\n        }\n      }\n      throw new Error(error.message || 'Failed to fetch report from server.');\n    }"""
          new = """    if (error) {\n      console.warn('[PublicReportService.getById] Supabase RPC error:', error);\n      throw new Error(error.message || 'Failed to fetch report from server.');\n    }"""
          text = replace_once(text, old, new, 'getById RPC fallback')

          old = """    // Not found in database: only check seed in mock mode\n    if (isMockModeAllowed()) {\n      const seed = SEED_SUBMITTED_REPORTS.find((r) => r.id.toUpperCase() === cleanId);\n      if (seed) {\n        return {\n          report: mapSeedToReportItem(seed),\n          responses: [],\n          responseLoadError: false,\n        };\n      }\n    }\n\n    return null;"""
          text = replace_once(text, old, '    return null;', 'getById final seed fallback')
          text = text.replace('// In mock mode or when Supabase is not configured, fallback to getAll()', '// Reuse the fail-closed published-report path when Supabase is unavailable.')
          path.write_text(text)

          # Submission/response APIs: remove mock-success branches completely.
          path = Path('src/services/apiClient.ts')
          text = path.read_text()
          text = replace_once(text, "import { saveLocalMockReport } from './publicReportService';\n", '', 'mock report import')

          marker = 'if (!isSupabaseConfigured() || !supabase) {'
          occurrences = []
          pos = 0
          while True:
              idx = text.find(marker, pos)
              if idx < 0: break
              occurrences.append(idx)
              pos = idx + len(marker)
          if len(occurrences) != 3:
              raise SystemExit(f'Expected 3 Supabase availability branches in apiClient, found {len(occurrences)}')

          def matching_brace(source, open_idx):
              depth = 0
              in_str = None
              escape = False
              for i in range(open_idx, len(source)):
                  ch = source[i]
                  if in_str:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == in_str:
                          in_str = None
                      continue
                  if ch in "'\"`":
                      in_str = ch
                      continue
                  if ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0: return i
              raise SystemExit('Unmatched brace')

          replacements = [
              """if (!isSupabaseConfigured() || !supabase) {\n      const error: ApiError = {\n        code: 'SUPABASE_NOT_CONFIGURED',\n        message: 'Supabase client is not configured.',\n        messageBn: 'ডাটাবেজ সংযোগ কনফিগার করা নেই।',\n      };\n      throw error;\n    }""",
              """if (!isSupabaseConfigured() || !supabase) {\n      const error: ApiError = {\n        code: 'SUPABASE_NOT_CONFIGURED',\n        message: 'Supabase client is not configured.',\n        messageBn: 'ডাটাবেজ সংযোগ কনফিগার করা নেই।',\n      };\n      throw error;\n    }""",
              """if (!isSupabaseConfigured() || !supabase) {\n      const unavailableError: ApiError = {\n        code: 'SERVICE_UNAVAILABLE',\n        message: 'Submission service is currently unavailable. Your draft is preserved. Please try again later.',\n        messageBn: 'অভিযোগ জমা দেওয়ার সেবা এই মুহূর্তে সাময়িকভাবে অনুপলব্ধ। আপনার খসড়াটি সংরক্ষিত রয়েছে। অনুগ্রহ করে কিছুক্ষণ পর আবার চেষ্টা করুন।',\n      };\n      throw unavailableError;\n    }""",
          ]

          # Replace from the end so offsets remain valid.
          for idx, replacement in reversed(list(zip(occurrences, replacements))):
              open_idx = text.find('{', idx)
              close_idx = matching_brace(text, open_idx)
              text = text[:idx] + replacement + text[close_idx + 1:]
          path.write_text(text)

          # Remove runtime viewport diagnostics while preserving theme initialization.
          path = Path('src/components/layout/AppShell.tsx')
          text = path.read_text()
          text = replace_once(text, "import { ViewportDebugger } from '../debug/ViewportDebugger';\n", '', 'ViewportDebugger import')
          text = replace_once(text, "\n      {/* 10. Dev-only Viewport Sizing Debugger */}\n      {import.meta.env.DEV && <ViewportDebugger />}\n", '\n', 'ViewportDebugger render')
          path.write_text(text)

          path = Path('index.html')
          text = path.read_text()
          start = text.index('        // Viewport & screen reporting diagnostic for mobile browsers')
          end_marker = "        }\n      })();"
          end = text.index(end_marker, start)
          text = text[:start] + '      })();' + text[end + len(end_marker):]
          path.write_text(text)

          # Remove obsolete mock-mode env flag.
          env_path = Path('.env.example')
          env_lines = [line for line in env_path.read_text().splitlines() if not line.startswith('VITE_ENABLE_MOCK_MODE=')]
          env_path.write_text('\n'.join(env_lines) + '\n')
          PY

          rm src/data/seedSubmissions.ts
          rm src/components/debug/ViewportDebugger.tsx
          rm src/components/ui/ViewportDiagnostic.tsx

      - name: Verify mock and diagnostic removal
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "SEED_SUBMITTED_REPORTS\|seedSubmissions\|sobaike_janao_mock_reports\|VITE_ENABLE_MOCK_MODE\|ViewportDebugger\|ViewportDiagnostic\|Viewport Diagnostic" src .env.example index.html
          test ! -e src/data/seedSubmissions.ts
          test ! -e src/components/debug/ViewportDebugger.tsx
          test ! -e src/components/ui/ViewportDiagnostic.tsx
          grep -q "Public reports service is currently unavailable" src/services/publicReportService.ts
          grep -q "SERVICE_UNAVAILABLE" src/services/apiClient.ts

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Build production bundle
        run: npm run build

      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/mock-dead-code-cleanup.yml
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git commit -m "cleanup: remove public mock data and viewport diagnostics"
          git push origin HEAD:cleanup/mock-dead-code
