name: Apply contextual party UX fix

on:
  push:
    branches:
      - fix/new-report-ux-writing-parties
    paths:
      - scripts/patch_new_report_party_ux.py
      - .github/workflows/apply-contextual-party-ux-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/new-report-ux-writing-parties
          fetch-depth: 0

      - name: Apply exact source replacements
        run: python scripts/patch_new_report_party_ux.py

      - name: Commit patched composer files
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/report-composer/Step3ComplaintDetails.tsx src/components/report-composer/Step4Review.tsx
          git commit -m "fix(public): align new complaint party UX writing"
          git push origin HEAD:fix/new-report-ux-writing-parties
