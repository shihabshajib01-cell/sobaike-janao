name: One-shot PR70 design token normalizer

on:
  push:
    branches:
      - fix/public-design-system-100-closure

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-design-system-100-closure

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Normalize PR70 ReportDetail design tokens
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/ReportDetailPage.tsx')
          text = path.read_text()
          replacements = {
              'rounded-full': 'rounded-[var(--radius-pill)]',
              'font-semibold': 'font-[var(--font-weight-semibold)]',
              'font-medium': 'font-[var(--font-weight-medium)]',
              'font-bold': 'font-[var(--font-weight-bold)]',
              'font-normal': 'font-[var(--font-weight-regular)]',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - run: npm run audit:design-system
      - run: npm run lint
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Commit normalized file
        run: |
          if git diff --quiet -- src/pages/ReportDetailPage.tsx; then
            echo 'No normalization changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/ReportDetailPage.tsx
          git commit -m 'fix(ui): preserve PR70 with centralized design tokens'
          git push origin HEAD:fix/public-design-system-100-closure
