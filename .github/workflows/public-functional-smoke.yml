name: Public Functional Smoke

on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Multiple Deploy completions can target the same production revision. Keep only
# one heavyweight browser suite active so duplicate Playwright runs do not
# compete for browser/network/Supabase resources and create false regressions.
concurrency:
  group: public-functional-smoke-production
  cancel-in-progress: true

jobs:
  browser-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://shobaikejanao.com/
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout exact deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright accessibility runtime
        run: |
          npm install --no-save playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: Run comprehensive non-destructive Public browser smoke
        run: node scripts/public-functional-smoke.mjs

      - name: Run Public UI 100% regression closure smoke
        run: node scripts/public-ui-100-regression-smoke.mjs

      - name: Run public form regression matrix
        run: node scripts/public-form-regression-matrix.mjs

      - name: Run complete non-destructive report composer journey
        run: node scripts/public-composer-100-regression-smoke.mjs

      - name: Run Public WCAG accessibility smoke
        run: node scripts/public-accessibility-smoke.mjs
