name: Temporary UI Cleanup Codemod

on:
  push:
    branches: [public-ui-system-cleanup-2]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public-ui-system-cleanup-2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply scoped UI-system cleanup
        shell: python
        run: |
          from pathlib import Path

          def replace_required(path, replacements):
              p = Path(path)
              text = p.read_text()
              original = text
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Expected pattern not found in {path}: {old}')
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'No changes produced for {path}')
              p.write_text(text)

          replace_required('src/pages/MorePage.tsx', [
              ('bg-amber-500/10 border border-amber-500/30', 'bg-ui-warning-bg border border-ui-warning-border'),
              ('text-amber-600 dark:text-amber-400', 'text-ui-warning-text'),
              ('bg-blue-500/10 border border-blue-500/30', 'bg-ui-info-bg border border-ui-info-border'),
              ('text-blue-600 dark:text-blue-400', 'text-ui-info-text'),
              ('text-amber-500', 'text-ui-warning-text'),
              ('bg-[var(--sec-utility-bg)] text-[var(--sec-utility-bg)] text-amber-700 dark:text-amber-300 border border-amber-500/30', 'bg-ui-warning-bg text-ui-warning-text border border-ui-warning-border'),
              ('bg-red-500/10 border border-red-500/30', 'bg-ui-error-bg border border-ui-error-border'),
              ('text-red-600 dark:text-red-400', 'text-ui-error-text'),
              ('<span className="text-[14px] font-semibold text-ui-content-secondary">\n              {language === \'bn\' ? \'প্রদর্শন\' : \'Appearance\'}\n            </span>', '<p className="text-[14px] font-semibold text-ui-content-secondary">\n              {language === \'bn\' ? \'প্রদর্শন\' : \'Appearance\'}\n            </p>'),
          ])

          replace_required('src/components/media/ImageAttachmentPicker.tsx', [
              ('bg-rose-500/10 border border-rose-500/30 rounded-xl flex items-start gap-2.5 text-[14px] text-rose-700 dark:text-rose-400', 'bg-ui-error-bg border border-ui-error-border rounded-xl flex items-start gap-2.5 text-[14px] text-ui-error-text'),
              ('text-rose-600 dark:text-rose-400', 'text-ui-error-text'),
              ("'border-emerald-600 bg-emerald-500/10'", "'border-ui-success-border bg-ui-success-bg'"),
              ('text-emerald-600 dark:text-emerald-400 bg-emerald-500/10', 'text-ui-success-text bg-ui-success-bg'),
              ('text-emerald-600', 'text-ui-success-text'),
              ("'border-rose-500/50 bg-rose-500/5'", "'border-ui-error-border bg-ui-error-bg'"),
              ('bg-rose-950/80 p-3 flex flex-col items-center justify-center text-center text-rose-200', 'bg-ui-error-text/90 p-3 flex flex-col items-center justify-center text-center text-ui-content-inverse'),
              ('text-rose-400', 'text-ui-content-inverse'),
              ('bg-rose-600/90 hover:bg-rose-600 text-white', 'bg-ui-destructive-bg hover:bg-ui-destructive-hover text-ui-destructive-text'),
          ])

          replace_required('src/components/media/AttachmentLightboxModal.tsx', [
              ('bg-neutral-900 text-white', 'bg-ui-media-viewer-bg text-ui-media-viewer-text'),
              ('border-white/15', 'border-ui-media-viewer-border'),
              ('border-white/10 bg-neutral-900/90', 'border-ui-media-viewer-border bg-ui-media-viewer-bg-elevated'),
              ('bg-neutral-900/80 hover:bg-neutral-900 text-white border border-white/20', 'bg-ui-media-viewer-control hover:bg-ui-media-viewer-control-hover text-ui-media-viewer-text border border-ui-media-viewer-border'),
              ('focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-black', 'focus-visible:ring-ui-media-viewer-focus focus-visible:ring-offset-2 focus-visible:ring-offset-ui-media-viewer-bg'),
              ('bg-neutral-900/95 border-t border-white/10', 'bg-ui-media-viewer-bg-elevated border-t border-ui-media-viewer-border'),
              ("'border-emerald-500 scale-105 opacity-100 ring-2 ring-emerald-500/30'", "'border-ui-success-border scale-105 opacity-100 ring-2 ring-ui-success-border'"),
              ('bg-neutral-800 flex items-center justify-center text-[11px] text-white/50', 'bg-ui-media-viewer-control flex items-center justify-center text-[11px] text-ui-media-viewer-muted'),
          ])

          css = Path('src/index.css')
          css_text = css.read_text()
          anchor = '  --color-ui-overlay: var(--ui-overlay);\n'
          additions = '''  --color-ui-media-viewer-bg: var(--ui-media-viewer-bg);\n  --color-ui-media-viewer-bg-elevated: var(--ui-media-viewer-bg-elevated);\n  --color-ui-media-viewer-text: var(--ui-media-viewer-text);\n  --color-ui-media-viewer-muted: var(--ui-media-viewer-muted);\n  --color-ui-media-viewer-border: var(--ui-media-viewer-border);\n  --color-ui-media-viewer-control: var(--ui-media-viewer-control);\n  --color-ui-media-viewer-control-hover: var(--ui-media-viewer-control-hover);\n  --color-ui-media-viewer-focus: var(--ui-media-viewer-focus);\n'''
          if additions.strip() not in css_text:
              if anchor not in css_text:
                  raise SystemExit('CSS theme anchor not found')
              css_text = css_text.replace(anchor, anchor + additions, 1)

          root_anchor = '    --ui-overlay: rgba(5, 5, 5, 0.55);\n'
          root_additions = '''\n    /* Media viewer semantic colors */\n    --ui-media-viewer-bg: #171717;\n    --ui-media-viewer-bg-elevated: rgba(23, 23, 23, 0.94);\n    --ui-media-viewer-text: #FFFFFF;\n    --ui-media-viewer-muted: rgba(255, 255, 255, 0.55);\n    --ui-media-viewer-border: rgba(255, 255, 255, 0.16);\n    --ui-media-viewer-control: rgba(23, 23, 23, 0.82);\n    --ui-media-viewer-control-hover: #171717;\n    --ui-media-viewer-focus: #FFFFFF;\n'''
          if '--ui-media-viewer-bg:' not in css_text:
              if root_anchor not in css_text:
                  raise SystemExit('CSS root color anchor not found')
              css_text = css_text.replace(root_anchor, root_anchor + root_additions, 1)
          css.write_text(css_text)

          p = Path('src/components/report-composer/ReportComposerModal.tsx')
          text = p.read_text()
          marker = 'id="draft-confirm-close-modal"'
          idx = text.find(marker)
          if idx == -1:
              raise SystemExit('Draft close modal marker not found')
          start = max(0, idx - 300)
          end = min(len(text), idx + 600)
          segment = text[start:end]
          if 'maxWidth="lg"' not in segment:
              raise SystemExit('Expected maxWidth="lg" near draft confirmation modal not found')
          segment = segment.replace('maxWidth="lg"', 'maxWidth="md"', 1)
          text = text[:start] + segment + text[end:]
          p.write_text(text)

      - name: Scan direct Tailwind palette colors
        shell: python
        run: |
          from pathlib import Path
          import re
          palette = re.compile(r'(?<![\w-])(?:bg|text|border|ring|outline|from|via|to)-(?:slate|gray|zinc|neutral|stone|red|orange|amber|yellow|lime|green|emerald|teal|cyan|sky|blue|indigo|violet|purple|fuchsia|pink|rose)-\d{2,3}(?:/\d+)?')
          violations = []
          for p in Path('src').rglob('*'):
              if p.suffix not in {'.tsx', '.ts'}:
                  continue
              for i, line in enumerate(p.read_text().splitlines(), 1):
                  matches = palette.findall(line)
                  if matches:
                      violations.append((str(p), i, matches, line.strip()))
          if violations:
              print('Remaining direct palette classes:')
              for item in violations:
                  print(f'{item[0]}:{item[1]} {item[2]} :: {item[3]}')
              raise SystemExit(1)
          print('No direct Tailwind palette color classes found in src TS/TSX.')

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Commit scoped cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/MorePage.tsx src/components/media/ImageAttachmentPicker.tsx src/components/media/AttachmentLightboxModal.tsx src/components/report-composer/ReportComposerModal.tsx src/index.css
          git commit -m "refactor: align public UI with semantic system"
          git push origin HEAD:public-ui-system-cleanup-2
