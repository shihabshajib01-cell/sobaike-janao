name: Apply scoped report party UX fix

on:
  push:
    branches:
      - fix/new-report-ux-writing-party-context

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/new-report-ux-writing-party-context
          fetch-depth: 0

      - name: Apply validated source transformations
        run: python .github/scripts/apply_report_party_ux_fix.py

      - name: Verify intended transformations
        run: |
          grep -q "Bribe Demander Information" src/data/reportSubjectOptions.ts
          grep -q "contextual-party-type-select" src/components/report-composer/Step3ComplaintDetails.tsx
          grep -q "subjectConfig.sectionTitleBn" src/components/report-composer/Step3ComplaintDetails.tsx
          grep -q "Boolean(subjectConfig) && hasPartyData" src/components/report-composer/Step4Review.tsx
          ! grep -q "চাঁদা দাবিকারীর তথ্য (ঐচ্ছিক)" src/components/report-composer/Step3ComplaintDetails.tsx
          ! grep -q "Extortion Party Information (Optional)" src/components/report-composer/Step4Review.tsx

      - name: Commit scoped source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/report-composer/Step3ComplaintDetails.tsx src/components/report-composer/Step4Review.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix(public): align new report party UX writing"
          git push origin HEAD:fix/new-report-ux-writing-party-context
