name: Apply Public Hardening Dev Dependencies

on:
  push:
    branches: [hardening/public-100-closure]
    paths:
      - .github/workflows/apply-hardening-deps.yml

permissions:
  contents: write

jobs:
  dependencies:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: hardening/public-100-closure

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned quality dependencies
        run: |
          npm install --save-dev \
            eslint@9.35.0 \
            typescript-eslint@8.44.0 \
            eslint-plugin-react-hooks@5.2.0 \
            tsx@4.20.5 \
            playwright@1.55.0 \
            @axe-core/playwright@4.10.2

      - name: Commit package metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependencies already aligned."
            exit 0
          fi
          git commit -m "Quality: pin lint, test and accessibility tooling"
          git push origin HEAD:hardening/public-100-closure
