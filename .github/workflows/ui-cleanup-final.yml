name: Temporary Final UI System Verification

on:
  push:
    branches: [public-ui-system-cleanup-2]

permissions:
  contents: write

jobs:
  verify-and-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public-ui-system-cleanup-2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Finish semantic color and text cleanup
        shell: python
        run: |
          from pathlib import Path

          def apply(path, reps):
              p=Path(path); text=p.read_text()
              for old,new in reps:
                  if old not in text:
                      raise SystemExit(f'{path}: expected pattern missing: {old}')
                  text=text.replace(old,new)
              p.write_text(text)

          apply('src/components/media/AttachmentLightboxModal.tsx', [
            ('bg-black/85', 'bg-ui-media-viewer-backdrop'),
            ('bg-white/10 text-white', 'bg-ui-media-viewer-chip text-ui-media-viewer-text'),
            ('text-white/90', 'text-ui-media-viewer-text'),
            ('text-white/50', 'text-ui-media-viewer-muted'),
            ('bg-white/10 hover:bg-white/20 text-white', 'bg-ui-media-viewer-chip hover:bg-ui-media-viewer-chip-hover text-ui-media-viewer-text'),
            ('focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-neutral-900', 'focus-visible:ring-ui-media-viewer-focus focus-visible:ring-offset-2 focus-visible:ring-offset-ui-media-viewer-bg'),
            ('bg-black/95', 'bg-ui-media-viewer-stage'),
            ('bg-black/40 border border-white/5', 'bg-ui-media-viewer-strip border border-ui-media-viewer-border-soft'),
            ('focus-visible:ring-white shrink-0', 'focus-visible:ring-ui-media-viewer-focus shrink-0'),
            ('<span className="shrink-0 px-2.5 py-1 rounded-full bg-ui-media-viewer-chip text-ui-media-viewer-text text-[12px] sm:text-[13px] font-semibold tracking-wide">', '<p className="shrink-0 px-2.5 py-1 rounded-full bg-ui-media-viewer-chip text-ui-media-viewer-text text-[12px] sm:text-[13px] font-semibold tracking-wide">'),
            ('</span>\n\n            {/* Filename & optional size */}', '</p>\n\n            {/* Filename & optional size */}'),
            ('<span className="font-medium text-ui-media-viewer-text truncate inline-block max-w-[200px] sm:max-w-[320px] align-middle" title={imageName}>', '<p className="font-medium text-ui-media-viewer-text truncate inline-block max-w-[200px] sm:max-w-[320px] align-middle" title={imageName}>'),
            ('</span>\n              {imageSize ? (\n                <span className="text-ui-media-viewer-muted text-[12px] ml-2">', '</p>\n              {imageSize ? (\n                <p className="text-ui-media-viewer-muted text-[12px] ml-2 inline-block">'),
            ('</span>\n              ) : null}', '</p>\n              ) : null}'),
            ('<span className="text-[14px]">\n                {language === \'bn\' ? \'ছবিটি লোড করা যায়নি\' : \'Image preview unavailable\'}\n              </span>', '<p className="text-[14px]">\n                {language === \'bn\' ? \'ছবিটি লোড করা যায়নি\' : \'Image preview unavailable\'}\n              </p>'),
          ])

          apply('src/components/media/ImageAttachmentPicker.tsx', [
            ('focus-visible:ring-white', 'focus-visible:ring-ui-focus'),
            ('<span className="leading-[22px]">{language === \'bn\' ? errorMessage.bn : errorMessage.en}</span>', '<p className="leading-[22px]">{language === \'bn\' ? errorMessage.bn : errorMessage.en}</p>'),
            ('<span className="text-[12px] leading-tight">\n                          {language === \'bn\' ? img.compressionError.bn : img.compressionError.en}\n                        </span>', '<p className="text-[12px] leading-tight">\n                          {language === \'bn\' ? img.compressionError.bn : img.compressionError.en}\n                        </p>'),
            ('bg-black/0 group-hover/thumb:bg-black/25', 'bg-transparent group-hover/thumb:bg-ui-media-overlay-soft'),
            ('bg-black/60 text-white', 'bg-ui-media-overlay-strong text-ui-media-viewer-text'),
            ('bg-black/75 text-white', 'bg-ui-media-overlay-label text-ui-media-viewer-text'),
            ('bg-black/40 backdrop-blur-[2px] flex flex-col items-center justify-center gap-1.5 text-white', 'bg-ui-media-viewer-strip backdrop-blur-[2px] flex flex-col items-center justify-center gap-1.5 text-ui-media-viewer-text'),
            ('animate-spin text-white', 'animate-spin text-ui-media-viewer-text'),
          ])

          apply('src/components/media/ImageViewer.tsx', [
            ('bg-black/90', 'bg-ui-media-overlay-max'),
            ('from-black/80', 'from-ui-media-gradient'),
            ('text-white', 'text-ui-media-viewer-text'),
            ('bg-white/10 hover:bg-white/20', 'bg-ui-media-viewer-chip hover:bg-ui-media-viewer-chip-hover'),
            ('focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-black', 'focus-visible:ring-ui-media-viewer-focus focus-visible:ring-offset-2 focus-visible:ring-offset-ui-media-viewer-bg'),
            ('bg-black/60 hover:bg-ui-media-overlay-max', 'bg-ui-media-overlay-strong hover:bg-ui-media-overlay-max'),
            ('border-white/20', 'border-ui-media-viewer-border-strong'),
            ('bg-black/60 border border-white/10', 'bg-ui-media-overlay-strong border border-ui-media-viewer-border'),
            ('focus-visible:ring-white', 'focus-visible:ring-ui-media-viewer-focus'),
          ])

          apply('src/components/media/ReportMediaGrid.tsx', [
            ('bg-black/60 backdrop-blur-[2px] flex items-center justify-center text-white', 'bg-ui-media-overlay-strong backdrop-blur-[2px] flex items-center justify-center text-ui-media-viewer-text'),
          ])

          apply('src/components/debug/ViewportDebugger.tsx', [
            ('bg-black/80 text-white', 'bg-ui-debug-overlay text-ui-debug-text'),
            ('border-white/20', 'border-ui-debug-border'),
            ('text-white/60', 'text-ui-debug-muted'),
            ('text-white/50', 'text-ui-debug-muted'),
          ])

          apply('src/components/explore/DistrictRankingPanel.tsx', [
            ("'bg-ui-accent text-white border-ui-accent'", "'bg-ui-accent text-ui-content-inverse border-ui-accent'"),
          ])

          p=Path('src/pages/MorePage.tsx'); text=p.read_text()
          old='className="w-8 h-8 rounded-lg bg-ui-accent text-white flex items-center justify-center font-bold text-[15px]"'
          if text.count(old) != 5:
              raise SystemExit(f'MorePage expected 5 numbered badge color uses, found {text.count(old)}')
          text=text.replace(old, 'className="w-8 h-8 rounded-lg bg-ui-accent text-ui-content-inverse flex items-center justify-center font-bold text-[15px]"')
          for n in ['১','২','৩','৪','৫']:
              text=text.replace(f'<span className="w-8 h-8 rounded-lg bg-ui-accent text-ui-content-inverse flex items-center justify-center font-bold text-[15px]">{n}</span>', f'<p className="w-8 h-8 rounded-lg bg-ui-accent text-ui-content-inverse flex items-center justify-center font-bold text-[15px]">{n}</p>')
          p.write_text(text)

          css=Path('src/index.css'); text=css.read_text()
          theme_anchor='  --color-ui-media-viewer-focus: var(--ui-media-viewer-focus);\n'
          aliases='''  --color-ui-media-viewer-backdrop: var(--ui-media-viewer-backdrop);\n  --color-ui-media-viewer-stage: var(--ui-media-viewer-stage);\n  --color-ui-media-viewer-chip: var(--ui-media-viewer-chip);\n  --color-ui-media-viewer-chip-hover: var(--ui-media-viewer-chip-hover);\n  --color-ui-media-viewer-strip: var(--ui-media-viewer-strip);\n  --color-ui-media-viewer-border-soft: var(--ui-media-viewer-border-soft);\n  --color-ui-media-viewer-border-strong: var(--ui-media-viewer-border-strong);\n  --color-ui-media-overlay-soft: var(--ui-media-overlay-soft);\n  --color-ui-media-overlay-strong: var(--ui-media-overlay-strong);\n  --color-ui-media-overlay-label: var(--ui-media-overlay-label);\n  --color-ui-media-overlay-max: var(--ui-media-overlay-max);\n  --color-ui-media-gradient: var(--ui-media-gradient);\n  --color-ui-debug-overlay: var(--ui-debug-overlay);\n  --color-ui-debug-text: var(--ui-debug-text);\n  --color-ui-debug-muted: var(--ui-debug-muted);\n  --color-ui-debug-border: var(--ui-debug-border);\n'''
          if '--color-ui-media-overlay-soft:' not in text:
              text=text.replace(theme_anchor, theme_anchor+aliases,1)
          root_anchor='    --ui-media-viewer-focus: #FFFFFF;\n'
          defs='''    --ui-media-viewer-backdrop: rgba(0, 0, 0, 0.85);\n    --ui-media-viewer-stage: rgba(0, 0, 0, 0.95);\n    --ui-media-viewer-chip: rgba(255, 255, 255, 0.10);\n    --ui-media-viewer-chip-hover: rgba(255, 255, 255, 0.20);\n    --ui-media-viewer-strip: rgba(0, 0, 0, 0.40);\n    --ui-media-viewer-border-soft: rgba(255, 255, 255, 0.05);\n    --ui-media-viewer-border-strong: rgba(255, 255, 255, 0.20);\n    --ui-media-overlay-soft: rgba(0, 0, 0, 0.25);\n    --ui-media-overlay-strong: rgba(0, 0, 0, 0.60);\n    --ui-media-overlay-label: rgba(0, 0, 0, 0.75);\n    --ui-media-overlay-max: rgba(0, 0, 0, 0.90);\n    --ui-media-gradient: rgba(0, 0, 0, 0.80);\n    --ui-debug-overlay: rgba(0, 0, 0, 0.80);\n    --ui-debug-text: #FFFFFF;\n    --ui-debug-muted: rgba(255, 255, 255, 0.55);\n    --ui-debug-border: rgba(255, 255, 255, 0.20);\n'''
          if '--ui-media-overlay-soft:' not in text:
              text=text.replace(root_anchor, root_anchor+defs,1)
          css.write_text(text)

      - name: Scan component/page color escapes
        shell: python
        run: |
          from pathlib import Path
          import re
          named=re.compile(r'(?<![\w-])(?:bg|text|border|ring|outline|from|via|to|accent)-(?:white|black|slate|gray|zinc|neutral|stone|red|orange|amber|yellow|lime|green|emerald|teal|cyan|sky|blue|indigo|violet|purple|fuchsia|pink|rose)(?:-\d{2,3})?(?:/\d+)?')
          arbitrary=re.compile(r'(?:bg|text|border|ring|outline|from|via|to)-\[#[0-9a-fA-F]{3,8}\]')
          violations=[]
          for root in [Path('src/components'),Path('src/pages')]:
              for p in root.rglob('*.tsx'):
                  for i,line in enumerate(p.read_text().splitlines(),1):
                      m=named.findall(line)+arbitrary.findall(line)
                      if m: violations.append((p,i,m,line.strip()))
          if violations:
              for p,i,m,line in violations: print(f'{p}:{i} {m} :: {line}')
              raise SystemExit('Direct component/page color escapes remain')
          print('PASS: zero direct named-palette/arbitrary-hex component/page color classes.')

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Commit final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components src/pages/MorePage.tsx src/index.css
          git commit -m "refactor: complete public UI system cleanup"
          git push origin HEAD:public-ui-system-cleanup-2
