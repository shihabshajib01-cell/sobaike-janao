name: Apply Illegal Occupation date-only patch

on:
  push:
    branches:
      - fix/illegal-occupation-date-only
    paths:
      - scripts/apply_illegal_occupation_date_only.py
      - .github/workflows/apply-illegal-occupation-date-only.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/illegal-occupation-date-only
          fetch-depth: 0

      - name: Apply guarded source changes
        run: python scripts/apply_illegal_occupation_date_only.py

      - name: Commit production source changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix(public): make illegal occupation date-only"
          git push origin HEAD:fix/illegal-occupation-date-only
