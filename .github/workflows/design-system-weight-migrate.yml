name: Temporary Public Font Weight Migration

on:
  push:
    branches:
      - audit-public-design-system-20260916

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'Apply public font-weight token migration') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit-public-design-system-20260916
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply font-weight token migration
        run: node scripts/design-system-weight-migrate.mjs

      - name: Verify design-system audit
        run: npm run audit:design-system

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Apply public font-weight token migration"
          git push origin HEAD:audit-public-design-system-20260916
